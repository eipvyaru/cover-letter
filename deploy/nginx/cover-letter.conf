server { listen 80; server_name cover-letter.ai-run.ru; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  server_name cover-letter.ai-run.ru;
  ssl_certificate /etc/letsencrypt/live/cover-letter.ai-run.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cover-letter.ai-run.ru/privkey.pem;
  location / { proxy_pass http://127.0.0.1:8792; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $remote_addr; proxy_no_cache 1; }
  location /api/generate { proxy_pass http://127.0.0.1:8792; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 300s; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $remote_addr; }
}
